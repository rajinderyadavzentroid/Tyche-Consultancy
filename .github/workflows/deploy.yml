name: Deploy Tyche Website

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.TYCHE_HOST }}
          username: ${{ secrets.TYCHE_USER }}
          key: ${{ secrets.TYCHE_SSH_KEY }}
          script: |
            set -e

            cd /home/deploy/apps/tyche-web

            echo "Pulling latest dev code..."
            git fetch origin
            git checkout dev
            git reset --hard origin/dev

            echo "Installing dependencies..."
            npm ci

            echo "Building application..."
            npm run build

            echo "Restarting PM2..."
            pm2 restart tyche-web

            echo "Deployment completed successfully."
